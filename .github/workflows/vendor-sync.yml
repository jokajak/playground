name: vendor-sync

# Fails when a utility's src/vendor/ doesn't match the versions locked in its
# package-lock.json — e.g. on a Dependabot bump PR until someone runs
# `npm install && npm run sync-vendor` in that directory and commits the
# result. Utilities with tests run them against the locked versions too.
on:
  pull_request:
    paths:
      - "qrcodemaker/**"
      - "chessreview/**"
      - ".github/workflows/vendor-sync.yml"
  push:
    branches: [main]
    paths:
      - "qrcodemaker/**"
      - "chessreview/**"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        utility: [qrcodemaker, chessreview]
    defaults:
      run:
        working-directory: ${{ matrix.utility }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run sync-vendor
      - name: Vendored files must match the locked dependency versions
        run: git diff --exit-code -- src/vendor/
      - name: Tests
        if: matrix.utility == 'chessreview'
        run: npm test
